<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cat</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }
        
        img {
            
            width: 100vw;
            height: 100vh;
            
            
            animation: coso 10s forwards;
        }

        
        @keyframes coso {
        
            0%, 80% {
                transform: scale(1) rotate(0deg);
                filter: hue-rotate(0deg) contrast(1) invert(0);
            }
            
            85% {
                transform: scaleX(3) scaleY(0.2); 
                filter: hue-rotate(90deg) contrast(2) invert(0);
            }
            88% {
                transform: scaleX(0.2) scaleY(3) rotate(45deg);
                filter: hue-rotate(180deg) contrast(3) invert(1);
            }
            92% {
                transform: scaleX(4) scaleY(4) rotate(720deg);
                filter: hue-rotate(270deg) contrast(2) invert(0);
            }
            96% {
                transform: scaleX(2) scaleY(0.5) rotate(-45deg) translateX(50px); 
                filter: hue-rotate(360deg) contrast(1.5) blur(10px); 
            }
            98% {
                transform: scaleX(2) scaleY(0.5) rotate(45deg) translateX(-50px); 
                filter: hue-rotate(180deg) contrast(1.5) blur(5px);
            }
    
            100% {
                transform: scale(1) rotate(0deg);
                filter: hue-rotate(0deg) contrast(1) invert(0) blur(0);
            }
        }
    </style>
</head>
<body>
    
    <img src="435828282_1412917059362897_8793464938545881401_n.jpg">
</body>
</html>
